name: Restore CStar metadata

on:
  push:
    paths:
      - '.github/workflows/restore-cstar.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore CStar metadata only
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('sstv.m3u')
          s = p.read_text(encoding='utf-8')
          old = 'https://upload.wikimedia.org/wikipedia/commons/thumb/c/c0/Logo_CStar_2016.svg/500px-CStar_2016.svg.png'
          new = 'https://upload.wikimedia.org/wikipedia/commons/thumb/c/c0/Logo_CStar_2016.svg/500px-Logo_CStar_2016.svg.png'
          if old not in s:
              raise SystemExit('Target CStar URL not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit restore
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sstv.m3u
          git diff --cached --quiet || git commit -m 'Restore CStar metadata'
          git push