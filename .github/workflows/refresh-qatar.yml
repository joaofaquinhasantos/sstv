name: Maintain Qatar-ready IPTV playlist

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "sstv.m3u"
      - ".github/scripts/build_qatar_playlist.py"
      - ".github/workflows/refresh-qatar.yml"
  schedule:
    - cron: "20 */6 * * *"

permissions:
  contents: write

concurrency:
  group: sstv-qatar-refresh
  cancel-in-progress: true

jobs:
  refresh-qatar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build deep-tested Qatar playlist
        run: python .github/scripts/build_qatar_playlist.py

      - name: Commit Qatar playlist refresh
        shell: bash
        run: |
          if git diff --quiet -- sstv-qatar.m3u; then
            echo "No Qatar playlist changes"
            exit 0
          fi
          git config user.name "sstv-bot"
          git config user.email "actions@users.noreply.github.com"
          git add sstv-qatar.m3u
          git commit -m "Refresh Qatar-ready stable playlist"
          git pull --rebase origin main
          git push
