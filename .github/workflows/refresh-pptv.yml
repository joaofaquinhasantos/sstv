name: Refresh PPTV stream

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-pptv.yml"
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch current PPTV signed stream
        shell: bash
        run: |
          python - <<'PY'
          import html
          import re
          import urllib.request
          from pathlib import Path

          api = "https://www-live.pptvhd36.com/api/live_player/program/1"
          req = urllib.request.Request(
              api,
              headers={
                  "User-Agent": "Mozilla/5.0",
                  "Referer": "https://www.pptvhd36.com/live",
              },
          )
          with urllib.request.urlopen(req, timeout=20) as r:
              body = r.read().decode("utf-8", "ignore")

          body = html.unescape(body).replace("\\/", "/")
          m = re.search(
              r"https://pptv36-9h0yba\.cdn\.byteark\.com/bamm-csai/playlist\.m3u8[^'\"<>\n\r ]+",
              body,
          )
          if not m:
              raise SystemExit("Could not find current PPTV ByteArk stream")

          stream = m.group(0)
          p = Path("sstv.m3u")
          text = p.read_text(encoding="utf-8")

          pattern = re.compile(
              r'(#EXTINF:[^\n]*PPTV HD 36[^\n]*\n(?:#EXTVLCOPT:[^\n]*\n)*)(https?://[^\n]+)',
              re.I,
          )
          new_text, count = pattern.subn(lambda x: x.group(1) + stream, text, count=1)
          if count != 1:
              raise SystemExit("PPTV entry not found in sstv.m3u")

          p.write_text(new_text, encoding="utf-8")
          print("Updated PPTV stream:", stream)
          PY

      - name: Commit refreshed URL
        shell: bash
        run: |
          if git diff --quiet -- sstv.m3u; then
            echo "PPTV URL already current"
            exit 0
          fi
          git config user.name "sstv-bot"
          git config user.email "actions@users.noreply.github.com"
          git add sstv.m3u
          git commit -m "Refresh PPTV HD 36 stream"
          git push
