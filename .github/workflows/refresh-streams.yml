name: Maintain IPTV streams

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-streams.yml"
  schedule:
    - cron: "37 */2 * * *"

permissions:
  contents: write

concurrency:
  group: sstv-stream-refresh
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh dynamic feeds and check fragile streams
        shell: bash
        run: |
          python - <<'PY'
          import html
          import re
          import ssl
          import urllib.request
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path

          PLAYLIST = Path("sstv.m3u")
          PPTV_API = "https://www-live.pptvhd36.com/api/live_player/program/1"
          IPTV_ORG_PT = "https://raw.githubusercontent.com/iptv-org/iptv/master/streams/pt.m3u"
          IPTV_ORG_BR = "https://raw.githubusercontent.com/iptv-org/iptv/master/streams/br.m3u"
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/154 Safari/537.36"
          ctx = ssl.create_default_context()

          def fetch_text(url, timeout=15, max_bytes=256_000, extra_headers=None):
              headers = {
                  "User-Agent": UA,
                  "Accept": "application/vnd.apple.mpegurl, application/x-mpegURL, */*",
              }
              if extra_headers:
                  headers.update(extra_headers)
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=timeout, context=ctx) as r:
                  data = r.read(max_bytes)
                  return r.geturl(), r.status, data.decode("utf-8", "ignore")

          def healthy(url, headers=None):
              try:
                  final, status, body = fetch_text(url, timeout=8, max_bytes=96_000, extra_headers=headers)
                  if not (200 <= status < 400):
                      return False, f"HTTP {status}", final
                  low = body.lower()
                  if "<html" in low and "#extm3u" not in low and "youtube.com" not in url and "dailymotion.com" not in url:
                      return False, "HTML response", final
                  return True, "ok", final
              except Exception as e:
                  return False, f"{type(e).__name__}: {e}", url

          def option_headers(option_text):
              headers = {}
              for line in option_text.splitlines():
                  line = line.strip()
                  if line.lower().startswith("#extvlcopt:http-referrer="):
                      headers["Referer"] = line.split("=", 1)[1]
                  elif line.lower().startswith("#extvlcopt:http-user-agent="):
                      headers["User-Agent"] = line.split("=", 1)[1]
              return headers or None

          def source_candidates(source_text, tvg_id):
              pattern = re.compile(
                  rf'(#EXTINF:[^\n]*tvg-id="{re.escape(tvg_id)}(?:@[^"]+)?"[^\n]*\n)'
                  rf'((?:#EXTVLCOPT:[^\n]*\n)*)(https?://[^\n]+)',
                  re.I,
              )
              candidates = []
              for match in pattern.finditer(source_text):
                  extinf = match.group(1).strip()
                  options = match.group(2).strip()
                  url = match.group(3).strip()
                  geo = "[geo-blocked]" in extinf.lower()
                  https = url.lower().startswith("https://")
                  preferred_host = any(host in url.lower() for host in (
                      "cdntvms.com.br", "nxplay.com.br", "akamaihd.net", "google.com"
                  ))
                  tokenized = "?token=" in url.lower()
                  score = (1 if geo else 0, 0 if https else 1, 0 if preferred_host else 1, 1 if tokenized else 0)
                  candidates.append((score, options, url))
              return sorted(candidates, key=lambda item: item[0])

          text = PLAYLIST.read_text(encoding="utf-8")
          changed = []

          # PPTV uses a short-lived signed URL. Refresh it from PPTV's official player API.
          try:
              _, _, body = fetch_text(
                  PPTV_API,
                  timeout=20,
                  extra_headers={"Referer": "https://www.pptvhd36.com/live"},
              )
              body = html.unescape(body).replace("\\/", "/")
              m = re.search(
                  r"https://pptv36-9h0yba\.cdn\.byteark\.com/bamm-csai/playlist\.m3u8[^'\"<>\n\r ]+",
                  body,
              )
              if m:
                  candidate = m.group(0)
                  pattern = re.compile(
                      r'(#EXTINF:[^\n]*PPTV HD 36[^\n]*\n(?:#EXTVLCOPT:[^\n]*\n)*)(https?://[^\n]+)',
                      re.I,
                  )
                  pm = pattern.search(text)
                  if pm:
                      current = pm.group(2).strip()
                      if current != candidate:
                          text = text[:pm.start(2)] + candidate + text[pm.end(2):]
                          changed.append("PPTV HD 36 signed URL refreshed")
                  else:
                      print("::warning::PPTV entry not found")
              else:
                  print("::warning::PPTV API returned no signed stream URL")
          except Exception as e:
              print(f"::warning::PPTV refresh failed: {e}")

          # Keep selected Portuguese entertainment channels synced to iptv-org's current public playlist.
          try:
              _, _, pt_source = fetch_text(IPTV_ORG_PT, timeout=20, max_bytes=512_000)
              for tvg_id, display_name in (
                  ("AXN.pt", "AXN"),
                  ("StarChannel.pt", "Star Channel"),
              ):
                  source = re.search(
                      rf'#EXTINF:[^\n]*tvg-id="{re.escape(tvg_id)}(?:@[^"]+)?"[^\n]*\n'
                      rf'((?:#EXTVLCOPT:[^\n]*\n)*)(https?://[^\n]+)',
                      pt_source,
                      re.I,
                  )
                  if not source:
                      print(f"::warning::iptv-org source entry not found: {display_name}")
                      continue

                  option_lines = [line.strip() for line in source.group(1).splitlines() if line.strip()]
                  stream_url = source.group(2).strip()
                  block = (
                      f'#EXTINF:-1 tvg-name="{display_name}" tvg-id="{tvg_id}" tvg-country="PT" group-title="Portugal",{display_name}\n'
                      + (("\n".join(option_lines) + "\n") if option_lines else "")
                      + stream_url
                      + "\n"
                  )

                  existing = re.compile(
                      rf'#EXTINF:[^\n]*tvg-id="{re.escape(tvg_id)}"[^\n]*\n'
                      rf'(?:#EXTVLCOPT:[^\n]*\n)*(?:https?://[^\n]+)\n?',
                      re.I,
                  )
                  current = existing.search(text)
                  if current:
                      if current.group(0).rstrip() != block.rstrip():
                          text = text[:current.start()] + block + text[current.end():]
                          changed.append(f"{display_name} synced from iptv-org")
                  else:
                      marker = "# === SPORTS | PORTUGAL ==="
                      if marker in text:
                          text = text.replace(marker, block + "\n" + marker, 1)
                          changed.append(f"{display_name} added from iptv-org")
                      else:
                          print(f"::warning::Portugal insertion marker missing for {display_name}")
          except Exception as e:
              print(f"::warning::iptv-org Portugal sync failed: {e}")

          # Build and maintain a Brazil group from current iptv-org entries.
          # Prefer HTTPS, non-geo-blocked and non-tokenized candidates that pass a live health check.
          try:
              _, _, br_source = fetch_text(IPTV_ORG_BR, timeout=20, max_bytes=2_000_000)
              brazil_channels = (
                  ("RedeGlobo.br", "Globo"),
                  ("Record.br", "Record"),
                  ("SBTNacional.br", "SBT"),
              )

              brazil_marker = "# === BRAZIL ==="
              thailand_marker = "# === THAILAND ==="
              if brazil_marker not in text and thailand_marker in text:
                  text = text.replace(thailand_marker, brazil_marker + "\n\n" + thailand_marker, 1)
                  changed.append("Brazil group created")

              for tvg_id, display_name in brazil_channels:
                  candidates = source_candidates(br_source, tvg_id)
                  if not candidates:
                      print(f"::warning::iptv-org Brazil source entry not found: {display_name}")
                      continue

                  selected = None
                  for _, options, url in candidates:
                      headers = option_headers(options)
                      ok, reason, final = healthy(url, headers)
                      if ok:
                          selected = (options, url)
                          print(f"BRAZIL SOURCE OK: {display_name}: {url}" + (f" -> {final}" if final != url else ""))
                          break
                      print(f"BRAZIL SOURCE FAILED: {display_name}: {url} ({reason})")

                  if not selected:
                      print(f"::warning::No healthy Brazil candidate found for {display_name}; keeping existing entry if present")
                      continue

                  options, stream_url = selected
                  option_lines = [line.strip() for line in options.splitlines() if line.strip()]
                  block = (
                      f'#EXTINF:-1 tvg-name="{display_name}" tvg-id="{tvg_id}" tvg-country="BR" group-title="Brazil",{display_name}\n'
                      + (("\n".join(option_lines) + "\n") if option_lines else "")
                      + stream_url
                      + "\n"
                  )

                  existing = re.compile(
                      rf'#EXTINF:[^\n]*tvg-id="{re.escape(tvg_id)}"[^\n]*\n'
                      rf'(?:#EXTVLCOPT:[^\n]*\n)*(?:https?://[^\n]+)\n?',
                      re.I,
                  )
                  current = existing.search(text)
                  if current:
                      if current.group(0).rstrip() != block.rstrip():
                          text = text[:current.start()] + block + text[current.end():]
                          changed.append(f"{display_name} Brazil stream refreshed")
                  elif thailand_marker in text:
                      text = text.replace(thailand_marker, block + "\n" + thailand_marker, 1)
                      changed.append(f"{display_name} added to Brazil group")
          except Exception as e:
              print(f"::warning::iptv-org Brazil sync failed: {e}")

          checks = []

          # SPORT TV: keep checking the user-supplied endpoints every two hours.
          sport_pattern = re.compile(
              r'#EXTINF:[^\n]*,(Sport TV(?:1|2|5|6|7|\+))\s*\n(?:#EXTVLCOPT:[^\n]*\n)*(https?://[^\n]+)',
              re.I,
          )
          for name, url in sport_pattern.findall(text):
              checks.append((f"SPORT {name}", url.strip(), None))

          # Other feeds that are more likely to rotate, redirect, expire, or depend on relays.
          watch_names = [
              "TVI", "CNN Portugal", "Porto Canal", "Canal 11 Internacional",
              "FIFA+ Portuguese", "FUEL TV", "PPTV HD 36", "T Sports 7",
              "AXN", "Star Channel", "Globo", "Record", "SBT",
          ]
          for channel in watch_names:
              pattern = re.compile(
                  rf'#EXTINF:[^\n]*,{re.escape(channel)}(?:\s*[^\n]*)?\n(?:#EXTVLCOPT:[^\n]*\n)*(https?://[^\n]+)',
                  re.I,
              )
              m = pattern.search(text)
              if m:
                  checks.append((channel, m.group(1).strip(), None))

          # Channel 7 needs the same referrer used by the playlist.
          ch7 = re.search(
              r'#EXTINF:[^\n]*,Channel 7 HD\s*\n#EXTVLCOPT:http-referrer=([^\n]+)\n(https?://[^\n]+)',
              text,
              re.I,
          )
          if ch7:
              checks.append(("Channel 7 HD", ch7.group(2).strip(), {"Referer": ch7.group(1).strip()}))

          with ThreadPoolExecutor(max_workers=10) as pool:
              futures = {
                  pool.submit(healthy, url, headers): (name, url)
                  for name, url, headers in checks
              }
              for future in as_completed(futures):
                  name, url = futures[future]
                  ok, reason, final = future.result()
                  if ok:
                      suffix = f" -> {final}" if final != url else ""
                      print(f"HEALTH OK: {name}: {url}{suffix}")
                  else:
                      print(f"::warning::HEALTH FAILED: {name}: {url} ({reason})")

          if changed:
              PLAYLIST.write_text(text, encoding="utf-8")
              print("Updated playlist URLs:")
              for item in changed:
                  print(" -", item)
          else:
              print("No URL changes needed")
          PY

      - name: Commit refreshed URLs
        shell: bash
        run: |
          if git diff --quiet -- sstv.m3u; then
            echo "No playlist URL changes"
            exit 0
          fi
          git config user.name "sstv-bot"
          git config user.email "actions@users.noreply.github.com"
          git add sstv.m3u
          git commit -m "Refresh IPTV stream URLs"
          git pull --rebase origin main
          git push
