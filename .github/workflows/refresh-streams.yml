name: Refresh IPTV backup streams

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-streams.yml"
  schedule:
    - cron: "37 */2 * * *"

permissions:
  contents: write

concurrency:
  group: sstv-stream-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh selected backup feeds and check fragile streams
        shell: bash
        run: |
          python - <<'PY'
          import re
          import ssl
          import urllib.request
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path

          PLAYLIST = Path("sstv.m3u")
          HERBERT = "https://raw.githubusercontent.com/HerbertHe/iptv-sources/gh-pages/all.m3u"
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/154 Safari/537.36"
          ctx = ssl.create_default_context()

          def fetch_text(url, timeout=15, max_bytes=512_000, extra_headers=None):
              headers = {
                  "User-Agent": UA,
                  "Accept": "application/vnd.apple.mpegurl, application/x-mpegURL, */*",
              }
              if extra_headers:
                  headers.update(extra_headers)
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=timeout, context=ctx) as r:
                  data = r.read(max_bytes)
                  return r.geturl(), r.status, data.decode("utf-8", "ignore")

          def healthy(url, headers=None):
              try:
                  final, status, body = fetch_text(url, timeout=8, max_bytes=96_000, extra_headers=headers)
                  if not (200 <= status < 400):
                      return False, f"HTTP {status}", final
                  low = body.lower()
                  if "<html" in low and "#extm3u" not in low:
                      return False, "HTML response", final
                  return True, "ok", final
              except Exception as e:
                  return False, f"{type(e).__name__}: {e}", url

          def parse_m3u(text):
              entries = []
              lines = text.splitlines()
              i = 0
              while i < len(lines):
                  line = lines[i].strip()
                  if line.startswith("#EXTINF:"):
                      meta = line
                      j = i + 1
                      while j < len(lines) and lines[j].strip().startswith("#"):
                          j += 1
                      if j < len(lines):
                          url = lines[j].strip()
                          if url and not url.startswith("#"):
                              m = re.search(r'tvg-name="([^"]+)"', meta, re.I)
                              tvg_name = m.group(1).strip() if m else ""
                              display = meta.rsplit(",", 1)[-1].strip() if "," in meta else ""
                              entries.append((tvg_name, display, url))
                      i = j
                  i += 1
              return entries

          text = PLAYLIST.read_text(encoding="utf-8")

          # These are backup entries only. HerbertHe regenerates its list every two hours,
          # so when an exact channel-name URL changes there, mirror that change here.
          # Primary/direct feeds above these backups are never overwritten by this job.
          source_map = {
              "ARTV": "ARTV (Backup)",
              "RTP Acores": "RTP Açores (Backup)",
              "RTP Madeira": "RTP Madeira (Backup)",
              "CANAL 11": "Canal 11 (Backup)",
              "Fuel TV Portugal": "FUEL TV Portugal (Backup)",
          }

          upstream_entries = []
          try:
              _, _, upstream = fetch_text(HERBERT, timeout=20)
              upstream_entries = parse_m3u(upstream)
          except Exception as e:
              print(f"::warning::Could not fetch HerbertHe source: {e}")

          changed = []
          for source_name, local_name in source_map.items():
              candidates = [u for n, _, u in upstream_entries if n.casefold() == source_name.casefold()]
              if not candidates:
                  print(f"::warning::No upstream candidate found for {source_name}")
                  continue
              candidate = candidates[0]
              pattern = re.compile(
                  rf'(#EXTINF:[^\n]*,{re.escape(local_name)}\s*\n(?:#EXTVLCOPT:[^\n]*\n)*)(https?://[^\n]+)',
                  re.I,
              )
              m = pattern.search(text)
              if not m:
                  print(f"::warning::Local backup entry not found: {local_name}")
                  continue
              current = m.group(2).strip()
              if current != candidate:
                  text = text[:m.start(2)] + candidate + text[m.end(2):]
                  changed.append(f"{local_name}: {current} -> {candidate}")

          # Build targeted health checks. SPORT TV URLs already present in the playlist are
          # checked every run. This detects recovery/failure without inventing new providers.
          checks = []
          sport_pattern = re.compile(
              r'#EXTINF:[^\n]*,(Sport TV(?:1|2|5|6|7|\+))\s*\n(?:#EXTVLCOPT:[^\n]*\n)*(https?://[^\n]+)',
              re.I,
          )
          for name, url in sport_pattern.findall(text):
              checks.append((f"SPORT {name}", url.strip(), None))

          watch_names = [
              "TVI", "CNN Portugal", "Porto Canal", "Canal 11 Internacional",
              "FUEL TV", "PPTV HD 36", "T Sports 7",
          ]
          for channel in watch_names:
              pattern = re.compile(
                  rf'#EXTINF:[^\n]*,{re.escape(channel)}(?:\s*[^\n]*)?\n(?:#EXTVLCOPT:[^\n]*\n)*(https?://[^\n]+)',
                  re.I,
              )
              m = pattern.search(text)
              if m:
                  checks.append((channel, m.group(1).strip(), None))

          # Channel 7 requires its referrer, so test it with the same header the playlist uses.
          ch7 = re.search(
              r'#EXTINF:[^\n]*,Channel 7 HD\s*\n#EXTVLCOPT:http-referrer=([^\n]+)\n(https?://[^\n]+)',
              text,
              re.I,
          )
          if ch7:
              checks.append(("Channel 7 HD", ch7.group(2).strip(), {"Referer": ch7.group(1).strip()}))

          # Also check the auto-refreshed backup endpoints, but a temporary connectivity
          # failure does not erase a known backup URL.
          for _, local_name in source_map.items():
              pattern = re.compile(
                  rf'#EXTINF:[^\n]*,{re.escape(local_name)}\s*\n(?:#EXTVLCOPT:[^\n]*\n)*(https?://[^\n]+)',
                  re.I,
              )
              m = pattern.search(text)
              if m:
                  checks.append((local_name, m.group(1).strip(), None))

          with ThreadPoolExecutor(max_workers=10) as pool:
              futures = {
                  pool.submit(healthy, url, headers): (name, url)
                  for name, url, headers in checks
              }
              for future in as_completed(futures):
                  name, url = futures[future]
                  ok, reason, final = future.result()
                  if ok:
                      suffix = f" -> {final}" if final != url else ""
                      print(f"HEALTH OK: {name}: {url}{suffix}")
                  else:
                      print(f"::warning::HEALTH FAILED: {name}: {url} ({reason})")

          if changed:
              PLAYLIST.write_text(text, encoding="utf-8")
              print("Updated backup URLs:")
              for item in changed:
                  print(" -", item)
          else:
              print("No backup URL changes needed")
          PY

      - name: Commit refreshed backup URLs
        shell: bash
        run: |
          if git diff --quiet -- sstv.m3u; then
            echo "No playlist URL changes"
            exit 0
          fi
          git config user.name "sstv-bot"
          git config user.email "actions@users.noreply.github.com"
          git add sstv.m3u
          git commit -m "Refresh IPTV backup URLs"
          git pull --rebase origin main
          git push
