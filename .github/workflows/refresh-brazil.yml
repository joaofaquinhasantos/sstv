name: Maintain Brazil IPTV channels

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-brazil.yml"
  schedule:
    - cron: "47 */2 * * *"

permissions:
  contents: write

concurrency:
  group: sstv-stream-refresh
  cancel-in-progress: false

jobs:
  refresh-brazil:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild national Brazil channels
        shell: bash
        run: |
          python - <<'PY'
          import re
          import ssl
          import urllib.parse
          import urllib.request
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path

          PLAYLIST = Path("sstv.m3u")
          SOURCE = "https://raw.githubusercontent.com/iptv-org/iptv/master/streams/br.m3u"
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/154 Safari/537.36"
          CTX = ssl.create_default_context()

          # National/non-regional only. Rede Globo is intentionally omitted because
          # current public playlist candidates are regional affiliates.
          CHANNELS = {
              "Band.br": "Band",
              "CanalGov.br": "Canal Gov",
              "CNNBrasil.br": "CNN Brasil",
              "Record.br": "Record",
              "RecordNews.br": "Record News",
              "SBTNacional.br": "SBT Nacional",
              "SBTNews.br": "SBT News",
              "TVBrasil.br": "TV Brasil",
          }

          def fetch(url, timeout=12, max_bytes=160000, headers=None):
              h = {"User-Agent": UA, "Accept": "application/vnd.apple.mpegurl, application/x-mpegURL, */*"}
              if headers:
                  h.update(headers)
              req = urllib.request.Request(url, headers=h)
              with urllib.request.urlopen(req, timeout=timeout, context=CTX) as r:
                  return r.geturl(), r.status, dict(r.headers), r.read(max_bytes)

          def first_uri(m3u, base):
              for raw in m3u.splitlines():
                  s = raw.strip()
                  if s and not s.startswith("#"):
                      return urllib.parse.urljoin(base, s)
              return None

          def option_headers(options):
              headers = {}
              for line in options.splitlines():
                  low = line.lower().strip()
                  if low.startswith("#extvlcopt:http-referrer="):
                      headers["Referer"] = line.split("=", 1)[1].strip()
                  elif low.startswith("#extvlcopt:http-user-agent="):
                      headers["User-Agent"] = line.split("=", 1)[1].strip()
                  elif low.startswith("#extvlcopt:http-origin="):
                      headers["Origin"] = line.split("=", 1)[1].strip()
              return headers

          def deep_hls(entry):
              try:
                  final, status, _, body = fetch(entry["url"], headers=option_headers(entry["options"]))
                  if not 200 <= status < 400:
                      return False, f"HTTP {status}"
                  txt = body.decode("utf-8", "ignore")
                  if "#extm3u" not in txt.lower():
                      return False, "not HLS"
                  child = first_uri(txt, final)
                  if child:
                      f2, s2, _, b2 = fetch(child, headers=option_headers(entry["options"]), timeout=10, max_bytes=120000)
                      if not 200 <= s2 < 400:
                          return False, f"child HTTP {s2}"
                      d2 = b2.decode("utf-8", "ignore")
                      if "#extm3u" in d2.lower():
                          seg = first_uri(d2, f2)
                          if seg:
                              _, s3, _, b3 = fetch(seg, headers=option_headers(entry["options"]), timeout=10, max_bytes=4096)
                              if not 200 <= s3 < 400 or not b3:
                                  return False, f"segment HTTP {s3}"
                  return True, "ok"
              except Exception as exc:
                  return False, f"{type(exc).__name__}: {exc}"

          _, _, _, raw = fetch(SOURCE, timeout=25, max_bytes=2_000_000)
          source = raw.decode("utf-8", "ignore")
          entry_re = re.compile(
              r'(?P<extinf>#EXTINF:[^\n]*\n)'
              r'(?P<options>(?:#EXTVLCOPT:[^\n]*\n)*)'
              r'(?P<url>https?://[^\n]+)', re.I
          )

          candidates = {key: [] for key in CHANNELS}
          for m in entry_re.finditer(source):
              extinf = m.group("extinf").strip()
              if "[geo-blocked]" in extinf.lower() or "[not 24/7]" in extinf.lower():
                  continue
              idm = re.search(r'tvg-id="([^"]+)"', extinf, re.I)
              if not idm:
                  continue
              base = idm.group(1).split("@", 1)[0]
              if base not in CHANNELS:
                  continue
              url = m.group("url").strip()
              if ".m3u8" not in url.lower():
                  continue
              options = m.group("options").strip()
              score = (
                  0 if url.startswith("https://") else 1,
                  0 if any(h in url.lower() for h in ("ebc.com.br","cdntvms.com.br","cloudfront.net","google.com","ottera.tv","streamlock.net")) else 1,
                  1 if "?token=" in url.lower() else 0,
              )
              candidates[base].append({"url":url,"options":options,"score":score})

          selected = {}
          with ThreadPoolExecutor(max_workers=18) as pool:
              futs = {}
              for tvg_id, entries in candidates.items():
                  for e in entries:
                      futs[pool.submit(deep_hls, e)] = (tvg_id,e)
              healthy = {k:[] for k in CHANNELS}
              for fut in as_completed(futs):
                  tvg_id,e=futs[fut]
                  ok,reason=fut.result()
                  if ok:
                      healthy[tvg_id].append(e)
                      print(f"BRAZIL OK: {CHANNELS[tvg_id]}: {e['url']}")
                  else:
                      print(f"BRAZIL FAILED: {CHANNELS[tvg_id]}: {e['url']} ({reason})")
              for tvg_id, entries in healthy.items():
                  if entries:
                      selected[tvg_id]=sorted(entries,key=lambda x:x["score"])[0]

          current = PLAYLIST.read_text(encoding="utf-8")
          section_re = re.compile(r'# === BRAZIL ===\n.*?(?=# === THAILAND ===)', re.S)
          if not section_re.search(current):
              raise RuntimeError("Brazil section marker missing")

          blocks=[]
          for tvg_id,display in CHANNELS.items():
              e=selected.get(tvg_id)
              if not e:
                  print(f"::warning::No healthy national candidate for {display}; omitted")
                  continue
              option_lines=[x.strip() for x in e["options"].splitlines() if x.strip()]
              block=f'#EXTINF:-1 tvg-name="{display}" tvg-id="{tvg_id}" tvg-country="BR" group-title="Brazil",{display}\n'
              if option_lines:
                  block += "\n".join(option_lines)+"\n"
              block += e["url"]
              blocks.append(block)

          if not blocks:
              raise RuntimeError("No healthy national Brazil channels found")

          new_section="# === BRAZIL ===\n"+"\n\n".join(blocks)+"\n\n"
          new_text=section_re.sub(new_section,current,count=1)
          if new_text != current:
              PLAYLIST.write_text(new_text,encoding="utf-8")
          print("BRAZIL NATIONAL SUMMARY:", len(blocks))
          PY

      - name: Commit Brazil playlist refresh
        shell: bash
        run: |
          if git diff --quiet -- sstv.m3u; then
            echo "No Brazil playlist changes"
            exit 0
          fi
          git config user.name "sstv-bot"
          git config user.email "actions@users.noreply.github.com"
          git add sstv.m3u
          git commit -m "Refresh national Brazil channels"
          git pull --rebase origin main
          git push
