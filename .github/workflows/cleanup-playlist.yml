name: Clean and consolidate playlist

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-playlist.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Consolidate groups and remove duplicates
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          p = Path('sstv.m3u')
          text = p.read_text(encoding='utf-8')
          lines = text.splitlines()

          # Preserve playlist header before the first visible section.
          first_section = next((i for i, line in enumerate(lines) if line.startswith('# === ')), len(lines))
          header = lines[:first_section]
          for i, line in enumerate(header):
              if line.startswith('# REVISION:'):
                  header[i] = '# REVISION: 2026-10-01-clean-groups'

          # Parse EXTINF blocks while preserving EXTVLCOPT lines and URLs.
          entries = []
          i = first_section
          while i < len(lines):
              if not lines[i].startswith('#EXTINF:'):
                  i += 1
                  continue
              block = [lines[i]]
              j = i + 1
              while j < len(lines) and lines[j].startswith('#') and not lines[j].startswith('#EXTINF:'):
                  block.append(lines[j])
                  j += 1
              if j < len(lines) and lines[j].strip() and not lines[j].startswith('#'):
                  block.append(lines[j])
                  entries.append(block)
                  i = j + 1
              else:
                  i += 1

          def get_group(extinf):
              m = re.search(r'group-title="([^"]*)"', extinf, re.I)
              return m.group(1).strip() if m else ''

          def get_name(extinf):
              return extinf.rsplit(',', 1)[-1].strip() if ',' in extinf else extinf

          def clean_name(name):
              s = name
              # Remove source/platform markers and quality suffixes only for deduplication.
              s = re.sub(r'[ⒹⒼⓎⓈ]', '', s)
              s = re.sub(r'\s*\((?:2160p|1080p|720p|576p|480p|360p|4K|HD|SD)\)\s*$', '', s, flags=re.I)
              s = re.sub(r'\s+', ' ', s).strip().casefold()
              return s

          canonical_group = {
              'france': 'France',
              'portugal': 'Portugal',
              'sports | portugal': 'SPORTS | Portugal',
              'sports | popular': 'SPORTS | Portugal',
              'thailand': 'Thailand',
              'kids | english': 'KIDS | English',
          }

          # Explicitly discard temporary backup groups; their primary channels already exist.
          kept = []
          for block in entries:
              extinf = block[0]
              group = get_group(extinf)
              gl = group.casefold()
              if 'backup' in gl:
                  continue
              if gl not in canonical_group:
                  continue
              new_group = canonical_group[gl]
              extinf = re.sub(r'group-title="[^"]*"', f'group-title="{new_group}"', extinf, count=1, flags=re.I)
              block = [extinf] + block[1:]
              kept.append((new_group, block))

          # Prefer the richer pre-existing SPORTS | Portugal entries over duplicate
          # copies imported into SPORTS | Popular. Otherwise keep the first occurrence.
          selected = {}
          order = []
          for group, block in kept:
              name = get_name(block[0])
              key = (group.casefold(), clean_name(name))
              if key not in selected:
                  selected[key] = block
                  order.append(key)
                  continue

              old = selected[key]
              old_meta = old[0]
              new_meta = block[0]
              old_score = int('tvg-id=' in old_meta) + int('tvg-logo=' in old_meta) + int('tvg-chno=' in old_meta)
              new_score = int('tvg-id=' in new_meta) + int('tvg-logo=' in new_meta) + int('tvg-chno=' in new_meta)
              if new_score > old_score:
                  selected[key] = block

          grouped = {g: [] for g in ['France', 'Portugal', 'SPORTS | Portugal', 'Thailand', 'KIDS | English']}
          for key in order:
              group = next(g for g in grouped if g.casefold() == key[0])
              grouped[group].append(selected[key])

          # Put numbered national channels in channel-number order where metadata exists.
          def chno(block):
              m = re.search(r'tvg-chno="([^"]+)"', block[0], re.I)
              if not m:
                  return (1, 9999)
              try:
                  return (0, int(m.group(1)))
              except ValueError:
                  return (1, 9999)

          grouped['France'].sort(key=chno)
          grouped['Portugal'].sort(key=chno)
          grouped['Thailand'].sort(key=chno)

          # Sports: Portuguese linear channels first, then the free/international feeds.
          sports_priority = {
              'canal 11 internacional': 10,
              'sport tv1': 20,
              'sport tv2': 21,
              'sport tv5': 25,
              'sport tv6': 26,
              'sport tv7': 27,
              'sport tv+': 28,
              'fifa+ portuguese': 40,
              'fuel tv': 50,
              'nautical channel': 60,
              'motorvision': 70,
              'red bull tv': 80,
          }
          grouped['SPORTS | Portugal'].sort(
              key=lambda b: (sports_priority.get(clean_name(get_name(b[0])), 999), clean_name(get_name(b[0])))
          )

          # Rebuild with only five visible groups.
          out = header + ['']
          section_titles = {
              'France': '# === FRANCE ===',
              'Portugal': '# === PORTUGAL ===',
              'SPORTS | Portugal': '# === SPORTS | PORTUGAL ===',
              'Thailand': '# === THAILAND ===',
              'KIDS | English': '# === KIDS — ENGLISH ===',
          }
          for group in ['France', 'Portugal', 'SPORTS | Portugal', 'Thailand', 'KIDS | English']:
              out.append(section_titles[group])
              for block in grouped[group]:
                  out.extend(block)
              out.append('')

          new_text = '\n'.join(out).rstrip() + '\n'
          p.write_text(new_text, encoding='utf-8')

          print('Groups:', ', '.join(grouped))
          for group, blocks in grouped.items():
              print(f'{group}: {len(blocks)} channels')
          print('Total:', sum(map(len, grouped.values())))
          PY

      - name: Commit cleaned playlist
        shell: bash
        run: |
          if git diff --quiet -- sstv.m3u; then
            echo "No playlist cleanup changes"
            exit 0
          fi
          git config user.name "sstv-bot"
          git config user.email "actions@users.noreply.github.com"
          git add sstv.m3u
          git commit -m "Clean playlist groups and remove duplicates"
          git pull --rebase origin main
          git push
